spring:
  datasource:
    url: jdbc:h2:mem:shuttle_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/test-migration
    out-of-order: false

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  admin:
    seed-email: admin@test.dev
    seed-password: Admin@1234
