services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service (8.0)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shuttle-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Csempire076@}
      MYSQL_DATABASE: ${DB_NAME:-shuttle_db}
      MYSQL_USER: ${DB_APP_USER:-shuttle_user}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-ShuttleApp@2026}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shuttle-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Spring Boot Backend Application
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shuttle-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shuttle_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Csempire076@}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-do-not-use-in-prod-must-be-at-least-256-bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@shuttle.dev}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin@1234}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:4165,http://localhost:4166}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      PASS_MOCK_PAID: ${PASS_MOCK_PAID:-true}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      WALLET_LOW_BALANCE_THRESHOLD: ${WALLET_LOW_BALANCE_THRESHOLD:-200.00}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      FIREBASE_CONFIG_PATH: ${FIREBASE_CONFIG_PATH:-}
      LOG_PATH: /app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - shuttle-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  # ----------------------------------------------------------------------------
  # Admin Web Dashboard (Flutter Web + Nginx)
  # ----------------------------------------------------------------------------
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    container_name: shuttle-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_WEB_PORT:-8081}:80"
    networks:
      - shuttle-network

volumes:
  mysql_data:
    name: shuttle_mysql_data
  backend_logs:
    name: shuttle_backend_logs

networks:
  shuttle-network:
    name: shuttle-network
    driver: bridge
